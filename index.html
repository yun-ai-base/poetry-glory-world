<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://yun-ai-base.github.io; font-src 'self' data:; base-uri 'self'; form-action 'none'">
  <title>中国诗词人·荣耀世界</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23f0d68a'/%3E%3Ccircle cx='18' cy='10' r='3' fill='%231a1a2e'/%3E%3Cpath d='M5 26 Q10 16 16 20 Q22 24 27 18' stroke='%23e8c87a' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3Ctext x='16' y='28' text-anchor='middle' font-size='6' fill='%23e8c87a' font-family='serif'%3E诗%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题栏 -->
  <header class="header">
    <h1 class="site-title">中国诗词人·荣耀世界</h1>
    <p class="site-subtitle">千年诗韵，星河璀璨</p>
  </header>

  <!-- 段位切换 Tab -->
  <nav class="tier-tabs" id="tierTabs">
    <div class="tier-bg-slider" id="tierBgSlider"></div>
    <button class="tier-tab active" data-tier="最强王者">最强王者<br><small>朱砂红</small></button>
    <button class="tier-tab" data-tier="至尊星耀">至尊星耀<br><small>天 青</small></button>
    <button class="tier-tab" data-tier="永恒钻石">永恒钻石<br><small>东方既白</small></button>
    <button class="tier-tab" data-tier="尊贵铂金">尊贵铂金<br><small>秋香色</small></button>
    <button class="tier-tab" data-tier="荣耀黄金">荣耀黄金<br><small>暮山紫</small></button>
  </nav>

  <!-- 搜索与筛选 -->
  <div class="search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="搜索诗人 / 名句 / 流派 / 团体…" autocomplete="off" aria-label="搜索诗人">
    <select id="eraSelect" aria-label="按时代筛选">
      <option value="全部">全部时代</option>
      <option value="先秦">先秦</option>
      <option value="两汉">两汉</option>
      <option value="魏晋南北朝">魏晋南北朝</option>
      <option value="隋唐">隋唐</option>
      <option value="五代">五代</option>
      <option value="宋">宋</option>
      <option value="元">元</option>
      <option value="明">明</option>
      <option value="清">清</option>
      <option value="近代">近代</option>
    </select>
    <button id="clearFilter" class="clear-btn" title="清除筛选" aria-label="清除筛选">✕</button>
    <div class="view-toggle" role="group" aria-label="视图切换">
      <button class="view-btn active" data-view="sphere" title="球体视图" aria-label="球体视图">🌐</button>
      <button class="view-btn" data-view="timeline" title="时间线视图" aria-label="时间线视图">🕐</button>
    </div>
  </div>

  <!-- 3D球体 Canvas 容器 -->
  <main class="sphere-container">
    <canvas id="sphereCanvas"></canvas>
    <p class="sphere-hint" id="sphereHint">双指缩放</p>
  </main>

  <!-- 历史时间线视图（与球体视图互斥显示） -->
  <div class="timeline-view" id="timelineView" hidden>
    <div class="timeline-scroll" id="timelineScroll"></div>
  </div>

  <!-- 底部状态栏 -->
  <footer class="footer-bar" id="footerBar">
    <span class="footer-info" id="tierInfo">最强王者 · 共10位诗人</span>
    <span class="footer-sep">|</span>
    <span class="footer-twin-btn" id="footerTwinBtn">🌌 孪生宇宙 <small style="font-size:0.7em;opacity:0.6;font-weight:400">点击见大世界</small></span>
    <span class="footer-sep">|</span>
    <span class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="切换主题">🌙</span>
  </footer>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-body" id="modalBody">
        <!-- 由JS动态填充 -->
      </div>
    </div>
  </div>

  <!-- 孪生宇宙弹窗 -->
  <div class="twin-overlay" id="twinView">
    <div class="twin-panel">
      <button class="twin-close" id="twinCloseBtn">✕</button>
      <div class="twin-header">
        <h2>🌌 诗词孪生宇宙</h2>
        <p class="twin-subtitle">我的其他项目 · 点击跳转</p>
      </div>
      <div class="twin-body" id="twinContainer"></div>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="js/utils.js"></script>
  <script src="js/poets-data.js"></script>
  <script src="js/poets-extra.js"></script>
  <script src="js/sphere3d.js"></script>
  <script src="js/radar-chart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/twin-universe.js"></script>
</body>
</html>
