<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国诗词人·荣耀世界</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23f0d68a'/%3E%3Ccircle cx='18' cy='10' r='3' fill='%231a1a2e'/%3E%3Cpath d='M5 26 Q10 16 16 20 Q22 24 27 18' stroke='%23e8c87a' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3Ctext x='16' y='28' text-anchor='middle' font-size='6' fill='%23e8c87a' font-family='serif'%3E诗%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题栏 -->
  <header class="header">
    <h1 class="site-title">中国诗词人·荣耀世界</h1>
    <p class="site-subtitle">千年诗韵，星河璀璨</p>
  </header>

  <!-- 段位切换 Tab -->
  <nav class="tier-tabs" id="tierTabs">
    <div class="tier-bg-slider" id="tierBgSlider"></div>
    <button class="tier-tab active" data-tier="最强王者">最强王者<br><small>朱砂红</small></button>
    <button class="tier-tab" data-tier="至尊星耀">至尊星耀<br><small>天 青</small></button>
    <button class="tier-tab" data-tier="永恒钻石">永恒钻石<br><small>东方既白</small></button>
    <button class="tier-tab" data-tier="尊贵铂金">尊贵铂金<br><small>秋香色</small></button>
    <button class="tier-tab" data-tier="荣耀黄金">荣耀黄金<br><small>暮山紫</small></button>
  </nav>

  <!-- 3D球体 Canvas 容器 -->
  <main class="sphere-container">
    <canvas id="sphereCanvas"></canvas>
    <p class="sphere-hint" id="sphereHint">双指缩放</p>
  </main>

  <!-- 底部状态栏 -->
  <footer class="footer-bar" id="footerBar">
    <span class="footer-info" id="tierInfo">最强王者 · 共10位诗人</span>
    <span class="footer-sep">|</span>
    <span class="footer-twin-btn" onclick="toggleTwin()">🌌 孪生宇宙 <small style="font-size:0.7em;opacity:0.6;font-weight:400">点击见大世界</small></span>
  </footer>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-body" id="modalBody">
        <!-- 由JS动态填充 -->
      </div>
    </div>
  </div>

  <!-- 孪生宇宙弹窗 -->
  <div class="twin-overlay" id="twinView" onclick="if(event.target===this)toggleTwin()">
    <div class="twin-panel">
      <button class="twin-close" onclick="toggleTwin()">✕</button>
      <div class="twin-header">
        <h2>🌌 诗词孪生宇宙</h2>
        <p class="twin-subtitle">我的其他项目 · 点击跳转</p>
      </div>
      <div class="twin-body" id="twinContainer"></div>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="js/utils.js"></script>
  <script src="js/poets-data.js"></script>
  <script src="js/poets-extra.js"></script>
  <script src="js/sphere3d.js"></script>
  <script src="js/radar-chart.js"></script>
  <script src="js/app.js"></script>

  <script>
// ═══ 孪生宇宙 ═══
var SELF_PROJECT = 'poetry-glory-world';
var PROJECTS_URL = 'https://yun-ai-base.github.io/psychscope/projects.json';
var TWIN_CATS = {
  ai:       { label: 'AI 对话',   emoji: '🤖' },
  tool:     { label: '工具',      emoji: '🛠️' },
  content:  { label: '内容精选',  emoji: '📖' }
};
var TWIN_ORDER = ['ai', 'tool', 'content'];
var twinBuilt = false;

function toggleTwin() {
  var v = document.getElementById('twinView');
  var willOpen = !v.classList.contains('open');
  v.classList.toggle('open');
  document.body.style.overflow = willOpen ? 'hidden' : '';
  // 弹窗打开时关闭球体交互，防止点击穿透误触发诗人节点
  if (window.__pgw) window.__pgw.setSphereInteractive(!willOpen);
  if (willOpen && !twinBuilt) {
    twinBuilt = true;
    buildTwin();
  }
}

function buildTwin() {
  var container = document.getElementById('twinContainer');
  function fail() {
    if (container) {
      container.innerHTML = '<div class="twin-fallback">🌫 其他项目暂时无法加载（网络或服务异常）</div>';
    }
  }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', PROJECTS_URL, true);
  xhr.timeout = 8000;
  xhr.onload = function () {
    if (xhr.status !== 200) { fail(); return; }
    try {
      var all = JSON.parse(xhr.responseText);
      var projects = all.filter(function (p) { return p.name !== SELF_PROJECT; });
      var byCat = {};
      projects.forEach(function (s) { (byCat[s.cat] = byCat[s.cat] || []).push(s); });
      var html = '';
      TWIN_ORDER.forEach(function (cat) {
        var list = byCat[cat];
        if (!list) return;
        var info = TWIN_CATS[cat];
        html += '<div class="twin-section">'
             + '<div class="twin-section-title">' + info.emoji + ' ' + info.label + '</div>'
             + '<div class="twin-grid">';
        list.forEach(function (s) {
          html += '<a class="twin-card" href="https://yun-ai-base.github.io/' + encodeURIComponent(s.name) + '/" target="_blank" rel="noopener">'
               + '<span class="twin-card-icon">' + s.icon + '</span>'
               + '<span class="twin-card-info">'
               + '<span class="twin-card-name">' + escHtml(s.name) + '</span>'
               + '<span class="twin-card-desc">' + escHtml(s.desc) + '</span>'
               + '</span>'
               + '<span class="twin-card-arrow">→</span>'
               + '</a>';
        });
        html += '</div></div>';
      });
      container.innerHTML = html || '<div class="twin-fallback">暂未发现其他项目</div>';
    } catch (e) { fail(); }
  };
  xhr.onerror = fail;
  xhr.ontimeout = fail;
  xhr.send();
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.getElementById('twinView').classList.contains('open')) {
    toggleTwin();
  }
});
  </script>
</body>
</html>
